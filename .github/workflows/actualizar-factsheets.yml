name: Actualizar links de factsheets

on:
  schedule:
    - cron: "0 13 12,26 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-factsheets
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factsheets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: factsheets/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Resolver links de factsheets
        run: python actualizar_links.py --credicorp-navegador

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en los links"
          else
            git commit -m "Actualiza links de factsheets (automático)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
