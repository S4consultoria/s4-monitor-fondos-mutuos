<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitores · S4 Inteligencia Financiera</title>
<link rel="icon" href="/assets/logo-s4.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1B2C;--card:#0F2438;--card2:#14304A;--border:#213E56;
  --txt:#EDEAE3;--muted:#8A9BAB;--gold:#C9A227;--blue:#3E6B8C;--green:#3C8C63;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--txt);font-family:'Poppins',sans-serif;font-size:14px;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(ellipse 60% 40% at 8% 0%,rgba(201,162,39,.06) 0%,transparent 60%),
    radial-gradient(ellipse 50% 50% at 95% 100%,rgba(62,107,140,.09) 0%,transparent 60%);
  display:flex;align-items:center;justify-content:center;padding:40px 16px;
}
.wrap{width:100%;max-width:760px;text-align:center}
.logo{width:76px;height:76px;border-radius:18px;background:var(--card2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.logo img{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(201,162,39,.25))}
h1{font-size:24px;font-weight:600;letter-spacing:.02em}
h1 em{color:var(--gold);font-style:normal}
.sub{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;margin:6px 0 34px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
a.card{display:block;text-align:left;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:24px 24px 22px;transition:border-color .2s,transform .2s}
a.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--gold);
  border:1px solid rgba(201,162,39,.35);border-radius:6px;padding:2px 8px;margin-bottom:12px}
.card h2{font-size:17px;font-weight:600;margin-bottom:6px}
.card p{color:var(--muted);font-size:12.5px}
.go{margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold)}
footer{margin-top:36px;color:var(--muted);font-size:11px;font-family:'IBM Plex Mono',monospace}
</style>
</head>
<body>
<main class="wrap">
  <div class="logo"><img src="/assets/logo-s4.png" alt="S4"></div>
  <h1>Monitores <em>S4</em></h1>
  <div class="sub">S4 INTELIGENCIA FINANCIERA ESTRATÉGICA</div>
  <div class="grid">
    <a class="card" href="/fondos/">
      <span class="tag">FFMM</span>
      <h2>Monitor de Fondos Mutuos</h2>
      <p>Fondos mutuos locales: rentabilidades, riesgo y ranking.</p>
      <div class="go">Entrar →</div>
    </a>
    <a class="card" href="/etfs/">
      <span class="tag">ETF</span>
      <h2>Monitor de ETFs</h2>
      <p>ETFs extranjeros listados en bolsa.</p>
      <div class="go">Entrar →</div>
    </a>
  </div>
  <footer>© S4 Consultoría</footer>
</main>
</body>
</html>
